<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusEngine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        #loading h1 { font-size: 24px; margin-bottom: 20px; }
        #progress-bar {
            width: 300px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 auto;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #67b7dc);
            width: 0%;
            transition: width 0.2s;
            border-radius: 3px;
        }
        #status { margin-top: 10px; font-size: 14px; color: #888; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="1"></canvas>

    <div id="loading">
        <h1>NexusEngine</h1>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="status">Loading...</div>
    </div>

    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                document.getElementById('loading').classList.add('hidden');
                Module.canvas.focus();
            },
            setStatus: function(text) {
                var status = document.getElementById('status');
                if (status) status.textContent = text;

                // Parse progress from Emscripten status messages
                var match = text.match(/(\d+(\.\d+)?)\/(\d+)/);
                if (match) {
                    var pct = (parseFloat(match[1]) / parseFloat(match[3])) * 100;
                    var fill = document.getElementById('progress-fill');
                    if (fill) fill.style.width = pct + '%';
                }
            },
            print: function(text) { console.log(text); },
            printErr: function(text) { console.error(text); }
        };

        // Resize canvas to fill viewport
        function resize() {
            var canvas = Module.canvas;
            var dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        // Prevent default touch actions
        Module.canvas.addEventListener('touchstart', function(e) { e.preventDefault(); });
        Module.canvas.addEventListener('touchmove', function(e) { e.preventDefault(); });
    </script>

    {{{ SCRIPT }}}
</body>
</html>
